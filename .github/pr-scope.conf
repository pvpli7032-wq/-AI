# PR 改动范围清单。由 scripts/check-pr-scope.sh 在 CI 里读取。
# 只能由 chore/guardrails-* 分支修改。越界时停下，在 PR 里说明，不要改本清单绕过。
#
# 格式（纯文本，bash 解析，行首 # 为注释）：
#   [段名]                本段对应的分支，见下方“分支匹配”
#   migrations <起> <止>   本段允许新增的迁移编号范围，可多行
#   allow <glob>          可新增，也可修改
#   new <glob>            只能新增，不能修改已有文件
#   delete <glob>         可删除；不写则一律不许删除
#
# glob 按 bash [[ $path == $glob ]] 语义：* 可以跨 /。
# 不在任何 allow/new 里的路径一律不许动（这同时拦住乱建目录）。
# 迁移目录 ruoyi-admin/src/main/resources/db/migration/ 另有规则：
#   已存在的脚本任何分支都不许改、不许删；新脚本必须叫 V<数字>__*.sql，
#   编号落在本段 migrations 范围内且不与 base 已有编号重复。
#   迁移目录里新增的脚本由 migrations 控制，不用再写 new。
#
# 分支匹配：
#   [line-N]            codex/line-N-*
#   [t05]               codex/t05-*
#   [chore-guardrails]  chore/guardrails-*
#   [chore-docs]        chore/docs-*

