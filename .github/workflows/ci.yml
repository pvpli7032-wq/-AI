name: CI

on:
  push:
    branches: [main, 'test/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-not-for-production
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: cps_test
          MYSQL_USER: cps_ci
          MYSQL_PASSWORD: ci-only-app-not-for-production
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=ci-only-app-not-for-production mysql --host=127.0.0.1 --user=cps_ci --database=cps_test --execute='SELECT 1' --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify MySQL transactions and Redis writes
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          result=$(docker exec -i -e MYSQL_PWD=ci-only-app-not-for-production "$MYSQL_CONTAINER" mysql --user=cps_ci --batch --skip-column-names cps_test <<'SQL'
          CREATE TEMPORARY TABLE t00_probe (id INT PRIMARY KEY, amount DECIMAL(10,2)) ENGINE=InnoDB;
          START TRANSACTION;
          INSERT INTO t00_probe VALUES (1, 12.34);
          ROLLBACK;
          SELECT IF(COUNT(*) = 0, 'rollback-ok', 'rollback-failed') FROM t00_probe;
          START TRANSACTION;
          INSERT INTO t00_probe VALUES (1, 12.34);
          COMMIT;
          SELECT amount FROM t00_probe WHERE id = 1;
          SQL
          )
          test "$result" = $'rollback-ok\n12.34'
          result=$(docker exec -e MYSQL_PWD=ci-only-app-not-for-production "$MYSQL_CONTAINER" mysql --user=cps_ci --batch --skip-column-names -e 'SELECT VERSION()')
          [[ "$result" == 8.* ]]
          test "$(docker exec "$REDIS_CONTAINER" redis-cli SET t00:probe ready EX 30)" = OK
          test "$(docker exec "$REDIS_CONTAINER" redis-cli GET t00:probe)" = ready
          docker exec "$REDIS_CONTAINER" redis-cli DEL t00:probe
      - name: Build placeholder alliance SDKs
        run: bash scripts/build-sdk-stub.sh
      - name: Package backend and run unit tests
        env:
          LINE4_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/cps_test?useSSL=true&serverTimezone=GMT%2B8
          LINE4_MYSQL_USER: root
          LINE4_MYSQL_PASSWORD: ci-only-root-not-for-production
        run: ./mvnw -B package
      - name: Require executed tests in each foundation module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for module in ("ruoyi-system", "ruoyi-framework", "ruoyi-admin"):
              reports = (Path(module) / "target/surefire-reports").glob("TEST-*.xml")
              suites = [ET.parse(report).getroot() for report in reports]
              executed = sum(int(suite.get("tests", "0")) - int(suite.get("skipped", "0")) for suite in suites)
              skipped = sum(int(suite.get("skipped", "0")) for suite in suites)
              failures = sum(int(suite.get("failures", "0")) for suite in suites)
              errors = sum(int(suite.get("errors", "0")) for suite in suites)
              if executed < 1:
                  raise SystemExit(f"{module}: no tests executed")
              if skipped or failures or errors:
                  raise SystemExit(f"{module}: skipped={skipped}, failures={failures}, errors={errors}")
              print(f"{module}: {executed} tests executed, skipped=0, failures=0, errors=0")
          PY
      - name: Migrate an empty database and verify packaged application
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
          SPRING_PROFILES_ACTIVE: druid,test
          CPS_UNION_ADAPTER_TBK: mock
          CPS_UNION_ADAPTER_JD: mock
          CPS_UNION_ADAPTER_PDD: mock
          TOKEN_SECRET: ci-only-token-secret-never-use-in-production-0123456789
          DB_USERNAME: cps_ci
          DB_PASSWORD: ci-only-app-not-for-production
          DRUID_USERNAME: ci-only-admin
          DRUID_PASSWORD: ci-only-druid-not-for-production
          TBK_APP_KEY: ci-placeholder
          TBK_APP_SECRET: ci-placeholder
          TBK_ADZONE_ID: "0"
          PDD_CLIENT_ID: ci-placeholder
          PDD_CLIENT_SECRET: ci-placeholder
          PDD_POSITION_ID: ci-placeholder
          JD_APP_KEY: ci-placeholder
          JD_APP_SECRET: ci-placeholder
          JD_SITE_ID: "0"
          JD_POSITION_ID: "0"
          DTK_APP_KEY: ci-placeholder
          DTK_APP_SECRET: ci-placeholder
          DTK_ADZONE_ID: "0"
          HDK_API_KEY: ci-placeholder
          WX_MINIAPP_APPID: wx-ci-placeholder
          WX_MINIAPP_SECRET: ci-placeholder
          SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://127.0.0.1:3306/cps_test?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=GMT%2B8
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: "6379"
          SPRING_DATA_REDIS_DATABASE: "1"
        run: |
          set -euo pipefail
          mysql_query() {
            docker exec -e MYSQL_PWD="$DB_PASSWORD" "$MYSQL_CONTAINER" \
              mysql --user="$DB_USERNAME" --batch --skip-column-names cps_test --execute="$1"
          }
          test "$(mysql_query "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'cps_test'")" = 0

          logging_config="$RUNNER_TEMP/cps-ci-logback.xml"
          app_log="$RUNNER_TEMP/cps-ci-application.log"
          response_file="$RUNNER_TEMP/cps-ci-captcha.json"
          cat > "$logging_config" <<'XML'
          <configuration>
              <appender name="console" class="ch.qos.logback.core.ConsoleAppender">
                  <encoder><pattern>%level %logger{36} - %msg%n</pattern></encoder>
              </appender>
              <root level="info"><appender-ref ref="console" /></root>
          </configuration>
          XML

          java -Djava.awt.headless=true \
            -Dlogback.configurationFile="$logging_config" -Dlogging.config="$logging_config" \
            -jar ruoyi-admin/target/ruoyi-admin.jar \
            --server.address=127.0.0.1 --server.port=8080 \
            --ruoyi.profile="$RUNNER_TEMP/cps-ci-uploads" > "$app_log" 2>&1 &
          app_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            if kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" 2>/dev/null || true
              for attempt in {1..20}; do
                kill -0 "$app_pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$app_pid" 2>/dev/null; then
                kill -KILL "$app_pid" 2>/dev/null || true
              fi
            fi
            wait "$app_pid" 2>/dev/null || true
            if (( status != 0 )); then
              cat "$app_log"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..120}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Packaged application exited before becoming ready" >&2
              exit 1
            fi
            http_status=$(curl --silent --max-time 2 --output "$response_file" \
              --write-out '%{http_code}' http://127.0.0.1:8080/captchaImage || true)
            if [[ "$http_status" = 200 ]]; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          kill -0 "$app_pid"
          python3 - "$response_file" <<'PY'
          import base64
          import json
          from pathlib import Path
          import re
          import sys

          response = json.loads(Path(sys.argv[1]).read_text())
          assert response.get("code") == 200, response
          assert response.get("captchaEnabled") is True, response
          assert re.fullmatch(r"[0-9a-f]{32}", response.get("uuid", "")), response
          image = base64.b64decode(response["img"], validate=True)
          assert len(image) > 100 and image.startswith(b"\xff\xd8") and image.endswith(b"\xff\xd9")
          print("/captchaImage: HTTP 200, business code 200, UUID and JPEG verified")
          PY
          captcha_uuid=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["uuid"])' "$response_file")
          test "$(docker exec "$REDIS_CONTAINER" redis-cli -n "$SPRING_DATA_REDIS_DATABASE" EXISTS "captcha_codes:$captcha_uuid")" = 1
          test "$(mysql_query "SELECT GROUP_CONCAT(version ORDER BY installed_rank) FROM flyway_schema_history WHERE version IN ('1', '2', '3') AND success = 1")" = 1,2,3
          test "$(mysql_query 'SELECT COUNT(*) FROM flyway_schema_history WHERE success = 0')" = 0
          test "$(mysql_query "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'sys_order_commission' AND column_name IN ('estimated_commission', 'actual_commission') AND data_type = 'decimal' AND numeric_precision = 14 AND numeric_scale = 4")" = 2
          test "$(mysql_query "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'sys_order_commission' AND column_name = 'settle_status' AND data_type = 'varchar' AND character_maximum_length = 20 AND is_nullable = 'NO' AND BINARY column_default = BINARY 'unsettled'")" = 1
          test "$(mysql_query "SELECT COUNT(*) FROM sys_config WHERE config_key = 'sys.account.initPasswordModify' AND config_value = '1'")" = 1
          test "$(mysql_query "SELECT COUNT(*) FROM sys_user WHERE user_id = 1 AND user_name = 'admin' AND pwd_update_date IS NULL")" = 1
          mysql_query 'SELECT version, description, success FROM flyway_schema_history ORDER BY installed_rank'
          kill -0 "$app_pid"

  package-test:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/test/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build placeholder alliance SDKs
        run: bash scripts/build-sdk-stub.sh
      - name: Package backend without tests
        run: ./mvnw -B -DskipTests package
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Build admin UI
        working-directory: ruoyi-ui
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm install
          npm run build:prod
      - name: List union SDK jars packaged in ruoyi-admin.jar
        run: |
          set -euo pipefail
          ls -l ruoyi-admin/target/*.jar
          jar_list=$(unzip -Z1 ruoyi-admin/target/ruoyi-admin.jar | grep -E '^BOOT-INF/lib/' | grep -iE 'taobao|jd-api|pop-sdk' || true)
          printf '%s\n' "$jar_list"
          test -n "$jar_list"
      - uses: actions/upload-artifact@v4
        with:
          name: ruoyi-admin-jar
          path: ruoyi-admin/target/ruoyi-admin.jar
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ruoyi-ui-dist
          path: ruoyi-ui/dist
          retention-days: 14

  scope-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prepare scope rules and scripts from the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/scope-tools"
          mkdir -p "$tools/scripts" "$tools/.github"
          # Use the base version so a PR cannot loosen its own rules.
          # Fall back to the PR's own copy only when base has none (the PR that introduces them).
          for f in scripts/check-pr-scope.sh scripts/check-pr-scope.test.sh .github/pr-scope.conf; do
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
              git show "$BASE_SHA:$f" > "$tools/$f"
            else
              echo "::notice::$f does not exist on base ($BASE_SHA); using the PR's own copy. This is expected only for the PR that introduces the scope check."
              cp "$f" "$tools/$f"
            fi
          done
      - name: Run scope check self-test
        run: bash "$RUNNER_TEMP/scope-tools/scripts/check-pr-scope.test.sh"
      - name: Check PR scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          bash "$RUNNER_TEMP/scope-tools/scripts/check-pr-scope.sh" \
            "$BASE_SHA" "$HEAD_SHA" "$BRANCH_NAME" "$RUNNER_TEMP/scope-tools/.github/pr-scope.conf"
